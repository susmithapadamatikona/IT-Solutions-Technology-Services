<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — Stackly Technology Graphite Signal theme.">
  <title>404 — Page Not Found | Stackly Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css?v=navy-teal-1">
  <link rel="stylesheet" href="css/neumorphism.css?v=7">
</head>
<body class="page-404">
    <div class="preloader" role="status" aria-live="polite" aria-label="Loading">
    <div class="preloader__inner">
      <div class="preloader__mark">
        <div class="preloader__orbit" aria-hidden="true"></div>
        <span class="themed-logo" aria-hidden="true"></span>
      </div>
      <div class="preloader__bar" aria-hidden="true"><span></span></div>
    </div>
    <span class="sr-only">Loading...</span>
  </div>

  <div class="site-bg" aria-hidden="true"></div>

  <main id="main">
    <section class="error-page" aria-labelledby="error-title">
      <div class="container error-page__inner" data-aos="zoom-in">
        <p class="error-page__code" aria-hidden="true">404</p>
        <h1 id="error-title">Signal lost — page not found</h1>
        <p class="error-page__text">
          The page you requested may have moved, been renamed, or never existed. Head back home or return to the previous page.
        </p>
        <div class="btn-group error-page__actions">
          <a class="btn btn--primary" href="index.html"><i class="fa-solid fa-house" aria-hidden="true"></i> Back to home</a>
          <button class="btn btn--secondary" type="button" data-go-back>
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Go back
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js?v=aos-site-1" defer></script>
</body>
</html>
